<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNest | Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/forgotPassword.css">
</head>
<body>

<nav class="navbar bg-white border-bottom">
    <div class="container navbar-brand">
        <img src="IMAGES/Edunest logo.png" alt="EduNest Logo" class="edunest-logo img-fluid">
    </div>
</nav>

<main class="forgot-page">
    <div class="container">
        <div class="forgot-card">
            <div class="forgot-form">
                <div class="form-content">

                    <div class="text-center heading-section">
                        <h1>Forgot Password?</h1>
                        <p>Enter your details and set a new password</p>
                    </div>

                    <form id="forgotPasswordForm">

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="fa-regular fa-envelope"></i>
                                </span>
                                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your registered email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Enter new password" required>
                                <button type="button" class="input-group-text password-toggle" onclick="togglePassword('newPassword','newPasswordIcon')">
                                    <i class="fa-regular fa-eye" id="newPasswordIcon"></i>
                                </button>
                            </div>
                            <small class="password-help">Password must be at least 8 characters long.</small>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-group custom-input">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                                <button type="button" class="input-group-text password-toggle" onclick="togglePassword('confirmPassword','confirmPasswordIcon')">
                                    <i class="fa-regular fa-eye" id="confirmPasswordIcon"></i>
                                </button>
                            </div>
                            <div id="passwordError" class="password-error"></div>
                        </div>

                        <button type="submit" class="btn reset-btn w-100">
                            Reset Password
                        </button>

                        <div class="back-login text-center">
                            <a href="signin.html">
                                <i class="fa-solid fa-arrow-left"></i>
                                Back to Login
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="JS/forgotPassword.js"></script>
</body>
</html>
