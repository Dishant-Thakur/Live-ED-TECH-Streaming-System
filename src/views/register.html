<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduNest-Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../public/CSS/register.css" />

  </head>
  <body>

    <main class="register-page">
      <section class="register-card">
        <div class="register-left">
          <img src="../public/IMAGES/Edunest logo.png" alt="EduNest" class="edunest-logo" />
          <div class="register-heading">
            <h1 class="fs-1">Create Your Account</h1>
            <p class="fs-5">Start your learning journey with EduNest</p>
          </div>

          <div class="role-tabs">
            <button type="button" class="role-tab" name = "role" value = "user">
              <i class="bi bi-person"></i>
              <span class="fw-medium"> User </span>
            </button>

            <button type="button" class="role-tab" name = "role" value = "faculty">
              <i class="bi
               bi-mortarboard"></i>

              <span class="fw-medium"> Faculty </span>
            </button>

            <button type="button" class="role-tab" role = "role" value = "admin">
              <i class="bi bi-shield"></i>

              <span class="fw-medium"> Admin </span>
            </button>
          </div>

          <form id="registerForm">
            <div class="field">
              <label for="name" class="fs-6"> Full Name </label>

              <div class="input-wrap">
                <i class="bi bi-person"></i>

                <input type="text"id="name" name="name" placeholder="Enter your full name" autocomplete="name" required/>
              </div>
            </div>

            <div class="field">
              <label for="phone" class = "fs-6"> Phone Number </label>

              <div class="input-wrap">
                <i class="bi bi-telephone"></i>

                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Enter your phone number"
                  maxlength="10"
                  autocomplete="tel"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="email" class="fs-6"> Email Address </label>

              <div class="input-wrap">
                <i class="bi bi-envelope"></i>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="password" class="fs-6"> Password </label>

              <div class="input-wrap">
                <i class="bi bi-lock"></i>

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="eye-btn"
                  onclick="togglePassword('password', this)"
                  aria-label="Show password"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="confirmPassword" class="fs-6"> Confirm Password </label>

              <div class="input-wrap">
                <i class="bi bi-lock"></i>

                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm your password"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="eye-btn"
                  onclick="togglePassword('confirmPassword', this)"
                  aria-label="Show confirm password"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="terms">
              <input type="checkbox" id="terms" required />

              <label for="terms" class = "fs-6">
                I agree to the
                <a href="#"> Terms of Service </a>
                and
                <a href="#"> Privacy Policy </a>
              </label>
            </div>

            <button type="submit" class="signup-btn fs-6">Sign Up</button>
            <div class="or-divider">
              <span></span>

              <small class = "fs-6"> or sign up with </small>

              <span></span>
            </div>

            <p class="login-text fs-6">
              Already have an account?

              <a href="#" class="fs-6"> Login </a>
            </p>
          </form>
        </div>

        <aside class="register-right">
          <div class="right-content">
            <h2>
              Your Future Starts with
              <span> EduNest </span>
            </h2>
          </div> <br>
          <img
            src="../public/IMAGES/register-graphic.png"
            alt="EduNest learning illustration"
            class="register-graphic"
          />
        </aside>
      </section>

      <section class="features">
        <div class="feature">
          <div class="feature-icon">
            <i class="bi bi-person"></i>
          </div>

          <div>
            <strong class="fs-5"> Expert Mentors </strong>
            <small class="fs-6"> Learn from industry experts </small>
          </div>
        </div>


        <div class="feature">
          <div class="feature-icon">
            <i class="bi bi-code-slash"></i>
          </div>

          <div>
            <strong class="fs-5"> Hands-on Projects </strong>
            <small class="fs-6"> Build real-world skills </small>
          </div>
        </div>

        <div class="feature">
          <div class="feature-icon">
            <i class="bi bi-award"></i>
          </div>

          <div>
            <strong class="fs-5"> Industry Recognized </strong>
            <small class="fs-6"> Get certified &amp; excel </small>
          </div>
        </div>
      </section>
    </main>

    <script src="../public/JS/register.js"></script>
  </body>
</html>
