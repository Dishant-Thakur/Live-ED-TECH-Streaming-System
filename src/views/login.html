<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Authenticate your account in Edunest">
    <title>SIGN IN | LOGIN PAGE</title>
    
    <link rel="shortcut icon" href="/IMAGES/Edunest logo.png" type="image/x-icon">    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/CSS/login.css" />
    
  </head>
  <body>

    <main class="register-page">
      <section class="register-card">

        <div class="register-left">
          <img src="/IMAGES/Edunest logo.png" alt="Edunest" class="edunest-logo" />
             <div class="register-heading text-center">

            <h1 class="fs-2">Welcome Back!</h1>
            <p class="fs-5">Login to get learning experience</p>
          </div>

          <form action = "api/v1/auth/login" id="loginForm" method="post">
           <div class="role-tabs">

            <label for="role" class="fs-6 fw-bold">Please Select your Role </label>
            <select name="role" id="select_role" class="role-tab">
              <option value="" aria-disabled>select</option>
              <option value="user">User</option>
              <option value="faculty">Faculty</option>
              <option value="admin">Admin</option>
            </select>
             <p class="text_valid mt-2"></p>
          </div>

            <div class="field">
              <label for="email" class="fs-6"> Email Address </label>
              <div class="input-wrap">
                <i class="bi bi-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"/>
              </div>
               <p class="text_valid mt-2"></p>
            </div>

            <div class="field">
              <label for="password" class="fs-6"> Password </label>
              <div class="input-wrap">
                <i class="bi bi-lock"></i>
                <input type="password" id="password"name="password" placeholder="Enter a password" autocomplete="current-password"/>

                <button type="button" class="eye-btn" aria-label="Show password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
               <p class="text_valid mt-2"></p>
            </div>

            <button type="submit" class="login-btn fs-6">Login</button>
            <p class="login-text fs-6">
              Don't have an account?
              <a href="register.html" class="fs-6"> Sign up </a>
            </p>
          </form>
        </div>

        <aside class="register-right">
          <div class="right-content">
            <h2 class="text-center mt-5">
              Your Future Starts with
              <span> EduNest </span> <br>
              <p class="fs-6 fw-bold">Gain skills, take experience and achieve goals</p>
            </h2>
          </div> <br>
          <img src="/IMAGES/register-graphic.png"alt="EduNest learning illustration"class="register-graphic"/>
        </aside>
      </section>

      <section class="features">
        <div class="feature">
          <div class="feature-icon">
            <i class="bi bi-person"></i>
          </div>
          <div>
            <strong class="fs-5"> Expert Mentors </strong>
            <small class="fs-6"> Learn from industry experts </small>
          </div>
        </div>


        <div class="feature">
          <div class="feature-icon">
            <i class="bi bi-code-slash"></i>
          </div>

          <div>
            <strong class="fs-5"> Hands-on Projects </strong>
            <small class="fs-6"> Build real-world skills </small>
          </div>
        </div>

        <div class="feature">
          <div class="feature-icon">
            <i class="bi bi-award"></i>
          </div>

          <div>
            <strong class="fs-5"> Industry Recognized </strong>
            <small class="fs-6"> Get certified &amp; excel </small>
          </div>
        </div>
      </section>
    </main>

    <script src="/JS/login.js"></script>
  </body>
</html>
