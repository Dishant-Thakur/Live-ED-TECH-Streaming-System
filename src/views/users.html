<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edunest Dashboard</title>
    <link rel="shortcut icon" href="/IMAGES/Edunest logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/CSS/users.css">
</head>

<body>
    <nav class="dashboard-navbar">
        <div class="navbar-container sticky-top">
            <a href="/dashboard" class="brand">
                <img src="/IMAGES/Edunest logo.png" alt="Edunest" loading="eager">
            </a>

            <div class="nav-links">
                <a href="/users.html" class="nav-link active">Home</a>
                <a href="/purchases.html" class="nav-link">Purchases</a>
                <a href="/courses.html" class="nav-link">Courses</a>
            </div>

            <div class="search-container">
                <span class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>

                <input type="text" id="courseSearch" class="search-input" placeholder="Search courses..."
                    autocomplete="off">
            </div>

            <div class="profile-container dropdown">
                <button class="profile-button" id="profileButton" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false" aria-label="Open profile menu">
                    <span id="userInitial"></span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end profile-dropdown" aria-labelledby="profileButton">
                    <li>
                        <a class="dropdown-item drop-content" href="/profile.html">
                            <i class="bi bi-person me-2"></i>
                            My Profile
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item drop-content" href="/settings.html">
                            <i class="bi bi-gear me-2"></i>
                            Settings
                        </a>
                    </li>

                      <li>
                        <button class="dropdown-item text-danger fs-7" id="logoutButton">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout
                        </button>
                    </li>
                </ul>
            </div>

            <button class="mobile-menu-button" id="mobileMenuButton">
                <i class="bi bi-list"></i>
            </button>
        </div>

        <div class="mobile-menu" id="mobileMenu">
            <a href="/users.html">Home</a>
            <a href="/purchases.html">Purchases</a>
            <a href="/courses.html">Courses</a>
        </div>
    </nav>

    <section class="dashboard-content">
        <h1 id="welcome_message"></h1>
        <p class="section_heading">Continue learning and explore new courses.</p>
    </section>

    <main class="container-fluid">
        <div class="container">
            <h class="fs-4">Featured</h1>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 courses-elements mt-2">
                    <div class="col shadow-lg rounded-3 courses-section">
                        <div class="course-image">
                            <img src="/IMAGES/frontend.png" alt="frontend course" loading="lazy"
                                class="img-fluid rounded-3">
                        </div>

                        <div class="course_content mt-5">
                            <p class="fs-5">HTML, CSS, JAVASCRIPT</p>
                        </div>

                    </div>

                    <div class="col shadow-lg rounded-3">
                        <div class="course-image">
                            <img src="/IMAGES/backend.png" alt="backend course" loading="lazy"
                                class="img-fluid rounded-3">
                        </div>

                    </div>

                    <div class="col shadow-lg rounded-3">

                    </div>

                    <div class="col shadow-lg rounded-3">

                    </div>

                </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/users.js"> </script>

</body>

</html>
